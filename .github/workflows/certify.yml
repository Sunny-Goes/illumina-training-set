name: certify

# Certifies every canary bug that carries a fix + reference PoC: the reference exploit must win
# on the vulnerable snapshot and die on the fixed variant. Ground truth is a validated artifact,
# not curation prose — a red job means the canary (or the judge), never the detector.
on:
  push:
    branches: [main]
    paths: ['canaries/**', 'ci/**', '.github/workflows/certify.yml']
  pull_request:
    paths: ['canaries/**', 'ci/**', '.github/workflows/certify.yml']
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # TODO: switch to @master once the lab's judge/counterfactual-poc branch merges.
      # Clone without submodules: vendor/azimo is private, pip's recursive clone fails on it —
      # and the judge CLI needs only the lab package itself.
      - run: git clone --depth 1 --branch judge/counterfactual-poc https://github.com/Sunny-Goes/illumina-lab.git /tmp/illumina-lab
      - run: pip install /tmp/illumina-lab
      - run: ci/certify.sh canaries/honk/precompile-success-unchecked
      # TODO: drop the SUBDIR env once canary.json's target_subdir is in the lab schema
      - run: SUBDIR=packages/contracts ci/certify.sh canaries/vechain-stargate/hayabusa
